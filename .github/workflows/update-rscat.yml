name: Update rscat cask

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cask:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read current cask version
        id: current
        shell: bash
        run: |
          set -euo pipefail
          v="$(ruby -e 't=File.read("Casks/rscat.rb"); puts t[/^\s*version\s+"([^"]+)"/, 1]')"
          if [ -z "$v" ]; then
            echo "Failed to read current version from Casks/rscat.rb"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Get latest GitHub release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          json="$(curl -fsSL https://api.github.com/repos/macOS-Terminal/rscat/releases/latest)"
          tag="$(echo "$json" | jq -r '.tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to get latest release tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          current="${{ steps.current.outputs.version }}"
          latest="${{ steps.release.outputs.tag }}"
          current="${current#v}"
          latest="${latest#v}"
          if [ "$current" = "$latest" ]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release asset and calculate sha256
        if: steps.compare.outputs.update_needed == 'true'
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.tag }}"
          clean_version="${version#v}"
          asset_url="https://github.com/macOS-Terminal/rscat/releases/download/${version}/rscat-${clean_version}-macos-universal.pkg"

          tmpdir="$(mktemp -d)"
          curl -fsSL -L "$asset_url" -o "$tmpdir/rscat.pkg"

          sha256="$(shasum -a 256 "$tmpdir/rscat.pkg" | awk '{print $1}')"

          echo "clean_version=$clean_version" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update cask file
        if: steps.compare.outputs.update_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("Casks/rscat.rb")
          text = path.read_text()

          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]

          text = re.sub(r'^\s*version\s+".*"$', f'  version "{version}"', text, flags=re.M)
          text = re.sub(r'^\s*sha256\s+".*"$', f'  sha256 "{sha256}"', text, flags=re.M)

          path.write_text(text)
          PY
        env:
          VERSION: ${{ steps.sha.outputs.clean_version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}

      - name: Create pull request
        if: steps.compare.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-rscat-cask
          commit-message: "chore: update rscat to ${{ steps.release.outputs.tag }}"
          title: "Update rscat to ${{ steps.release.outputs.tag }}"
          body: |
            Automated update from upstream GitHub release.

            - Release: `${{ steps.release.outputs.tag }}`
            - Asset: `${{ steps.sha.outputs.asset_url }}`
            - SHA256: `${{ steps.sha.outputs.sha256 }}`
          labels: automated, automerge, homebrew, cask
          delete-branch: true