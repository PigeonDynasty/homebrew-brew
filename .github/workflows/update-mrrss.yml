name: Update MrRSS cask

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cask:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read current cask version
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(ruby -e 'text=File.read("Casks/mrrss.rb"); puts text[/^\s*version\s+"([^"]+)"/, 1]')"
          if [ -z "$current_version" ]; then
            echo "Failed to read current version from Casks/mrrss.rb"
            exit 1
          fi
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Get latest GitHub release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          json="$(curl -fsSL https://api.github.com/repos/WCY-dt/MrRSS/releases/latest)"
          tag="$(echo "$json" | jq -r '.tag_name')"

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to get latest release tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          current="${{ steps.current.outputs.version }}"
          latest="${{ steps.release.outputs.tag }}"
          if [ "$current" = "$latest" ]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release asset and calculate sha256
        if: steps.compare.outputs.update_needed == 'true'
        id: sha
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.tag }}"
          clean_version="${version#v}"
          asset_url="https://github.com/WCY-dt/MrRSS/releases/download/${version}/MrRSS-${clean_version}-darwin-universal.dmg"

          tmpdir="$(mktemp -d)"
          curl -fsSL -L "$asset_url" -o "$tmpdir/MrRSS.dmg"

          sha256="$(shasum -a 256 "$tmpdir/MrRSS.dmg" | awk '{print $1}')"

          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update cask file
        if: steps.compare.outputs.update_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.tag }}"
          sha256="${{ steps.sha.outputs.sha256 }}"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("Casks/mrrss.rb")
          text = path.read_text()

          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]

          text = re.sub(r'^\s*version\s+".*"$', f'  version "{version}"', text, flags=re.M)
          text = re.sub(r'^\s*sha256\s+".*"$', f'  sha256 "{sha256}"', text, flags=re.M)

          path.write_text(text)
          PY
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          SHA256: ${{ steps.sha.outputs.sha256 }}

      - name: Create pull request
        if: steps.compare.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-mrrss-cask
          commit-message: "chore: update MrRSS to ${{ steps.release.outputs.tag }}"
          title: "Update MrRSS to ${{ steps.release.outputs.tag }}"
          body: |
            Automated update from upstream GitHub release.

            - Release: `${{ steps.release.outputs.tag }}`
            - Asset: `${{ steps.sha.outputs.asset_url }}`
            - SHA256: `${{ steps.sha.outputs.sha256 }}`
          labels: automated, homebrew, cask
          delete-branch: true

      - name: Add automerge label
        if: steps.compare.outputs.update_needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'chore/update-mrrss-cask',
              state: 'open',
            })

            if (prs.data.length === 0) {
              core.setFailed('PR not found')
              return
            }

            const pr = prs.data[0]

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['automerge'],
            })
