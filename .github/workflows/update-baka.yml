name: Update baka cask

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *" # 每天 UTC 03:23

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cask:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read current version
        id: current
        shell: bash
        run: |
          set -euo pipefail
          v="$(ruby -e 't=File.read("Casks/baka.rb"); puts t[/^\s*version\s+"([^"]+)"/, 1]')"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Get latest release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          json="$(curl -fsSL https://api.github.com/repos/AniBakaBaka/AniBaka/releases/latest)"
          tag="$(echo "$json" | jq -r '.tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to get latest tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          current="${{ steps.current.outputs.version }}"
          latest="${{ steps.release.outputs.tag }}"
          if [ "$current" = "$latest" ]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download assets and compute sha256
        if: steps.compare.outputs.update_needed == 'true'
        id: sha
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.tag }}"
          version_major="${version%%+*}"
          build="${version#*+}"

          arm_url="https://github.com/AniBakaBaka/AniBaka/releases/download/${version_major}/baka-${version}-macos-arm64.dmg"
          x86_url="https://github.com/AniBakaBaka/AniBaka/releases/download/${version_major}/baka-${version}-macos-x86_64.dmg"

          tmpdir="$(mktemp -d)"
          curl -fsSL -L "$arm_url" -o "$tmpdir/baka-arm64.dmg"
          curl -fsSL -L "$x86_url" -o "$tmpdir/baka-x86_64.dmg"

          arm_sha="$(shasum -a 256 "$tmpdir/baka-arm64.dmg" | awk '{print $1}')"
          x86_sha="$(shasum -a 256 "$tmpdir/baka-x86_64.dmg" | awk '{print $1}')"

          echo "version_major=$version_major" >> "$GITHUB_OUTPUT"
          echo "arm_url=$arm_url" >> "$GITHUB_OUTPUT"
          echo "x86_url=$x86_url" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$arm_sha" >> "$GITHUB_OUTPUT"
          echo "x86_sha=$x86_sha" >> "$GITHUB_OUTPUT"

      - name: Update cask file
        if: steps.compare.outputs.update_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.tag }}"
          arm_sha="${{ steps.sha.outputs.arm_sha }}"
          x86_sha="${{ steps.sha.outputs.x86_sha }}"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("Casks/baka.rb")
          text = path.read_text()

          version = os.environ["VERSION"]
          arm_sha = os.environ["ARM_SHA"]
          x86_sha = os.environ["X86_SHA"]

          text = re.sub(r'^\s*version\s+".*"$', f'  version "{version}"', text, flags=re.M)
          text = re.sub(r'^\s*sha256\s+".*PLACEHOLDER.*"$', f'    sha256 "{arm_sha}"', text, count=1, flags=re.M)
          text = re.sub(r'^\s*sha256\s+".*PLACEHOLDER.*"$', f'    sha256 "{x86_sha}"', text, count=1, flags=re.M)

          path.write_text(text)
          PY
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          ARM_SHA: ${{ steps.sha.outputs.arm_sha }}
          X86_SHA: ${{ steps.sha.outputs.x86_sha }}

      - name: Create pull request
        if: steps.compare.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-baka-cask
          commit-message: "chore: update baka to ${{ steps.release.outputs.tag }}"
          title: "Update baka to ${{ steps.release.outputs.tag }}"
          body: |
            Automated update from upstream GitHub release.

            - Release: `${{ steps.release.outputs.tag }}`
            - ARM asset: `${{ steps.sha.outputs.arm_url }}`
            - x86 asset: `${{ steps.sha.outputs.x86_url }}`
            - ARM SHA256: `${{ steps.sha.outputs.arm_sha }}`
            - x86 SHA256: `${{ steps.sha.outputs.x86_sha }}`
          labels: automated, automerge
          delete-branch: true
